name: Deploy site

# Pull requests run the build as validation; only pushes to main deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the deploy-pages action to publish, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish. Per-ref
# grouping keeps PR validation from queueing behind a main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # No binary cache: the build is ~75s straight from cache.nixos.org.
      - name: Build site
        run: nix build .#site --print-build-logs

      # The store path is read-only, which upload-pages-artifact cannot tar.
      # Dereference the symlink and drop the store's permission bits.
      - name: Stage artifact
        if: github.event_name != 'pull_request'
        run: cp -rL --no-preserve=mode,ownership result public

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
