name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy-pages action to publish, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build site
        run: nix build .#site --print-build-logs

      # The store path is read-only, which upload-pages-artifact cannot tar.
      # Dereference the symlink and drop the store's permission bits.
      - name: Stage artifact
        run: cp -rL --no-preserve=mode,ownership result public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
